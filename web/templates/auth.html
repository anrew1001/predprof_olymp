<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link href="../static/auth-style.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Авторизация</h1>
    </header>
    <main>
        <div class="auth-window">
            <div class="actions">
                <h2 class="active-action">Вход</h2>
                <h2>Регистрация</h2>
            </div>
            <div>
                <form method="post">
                    <p>Логин:</p>
                    <input type="text" name="login">
                    <p>Пароль:</p>
                    <input type="password" name="password">
                    <button type="submit" class="submit-btn">Войти</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
