<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>
    <link href="../static/auth-style.css" rel="stylesheet">
    <script src="../static/auth-script.js"></script>
</head>
<body>
    <header>
        <h1>Авторизация</h1>
    </header>
    <main>
        <div class="auth-window">
            <div class="actions">
                <h2 class="active-action" id="login-btn">Вход</h2>
                <h2 id="signup-btn">Регистрация</h2>
            </div>
            <div>
                <form method="post">
                    <label for="login">Логин:</label>
                    <input type="text" name="login" id="login" required>
                    <label for="password">Пароль:</label>
                    <input type="password" name="password" id="password" required>                    <button type="submit" class="submit-btn">Войти</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
